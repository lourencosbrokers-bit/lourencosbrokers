<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lourenço's Brokers Imóveis</title>
<meta name="description" content="Imóveis para comprar e alugar em Jacareí e região do Vale do Paraíba. Lourenço's Brokers Soluções Imobiliárias.">
<meta property="og:title" content="Lourenço's Brokers · Imóveis em Jacareí">
<meta property="og:description" content="Casas, apartamentos, terrenos e imóveis comerciais para venda e locação em Jacareí.">
<meta property="og:image" content="img/logo.png">
<link rel="icon" href="img/icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Site público: branco, azul-marinho e dourado. Os dados vêm de dados.json; as fotos, da pasta img/. */
:root{--navy:#070B4A;--gold:#E4BB61;--gold-hi:#F5DC8E;--gold-lo:#B98A2E;--gold-text:#8A5E0C;--gold-soft:#FBF1D6;--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F4F5FA;--ink:#14173F;--ink-2:#5E6389;--line:#E2E4EE;--ok:#0F7F58;--ok-soft:#DDF3EA;--warn:#8F6200;--warn-soft:#FBEFD0;--bad:#BE3A2C;--info:#2D52C6;--info-soft:#E1E8FA;--shadow:0 10px 30px rgba(10,15,74,.12);--f-display:'Cinzel',Georgia,serif;--f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;letter-spacing:.04em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
header.top img{height:46px;width:auto;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:var(--navy);border-color:transparent}.btn.pri:hover{filter:brightness(1.06)}
.btn svg{width:16px;height:16px}
.hero{background:linear-gradient(180deg,#fff,var(--surface-2));border-bottom:1px solid var(--line);box-shadow:inset 0 3px 0 var(--gold)}
.hero .wrap{padding-block:clamp(28px,6vw,64px);display:flex;flex-direction:column;gap:16px}
.hero h1{font-size:clamp(1.6rem,4.2vw,2.8rem);max-width:22ch;color:var(--navy);line-height:1.15}
.hero p{margin:0;color:var(--ink-2);max-width:56ch;font-size:1.05rem}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero small{color:var(--ink-2)}
section.list{padding-block:28px 56px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 16px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar select{width:auto;max-width:100%}.toolbar input{width:190px}
.count{color:var(--ink-2);font-size:.88rem;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.im{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;color:inherit}
.im:hover{box-shadow:var(--shadow);border-color:var(--gold)}
.ph{aspect-ratio:4/3;background:linear-gradient(145deg,#F6F7FB,#E6E9F4);position:relative;display:grid;place-items:center;color:var(--gold-lo);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph svg{width:44px;height:44px;opacity:.6}
.ph .tag{position:absolute;left:10px;top:10px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.74rem;font-weight:700;background:var(--gold-soft);color:var(--gold-text)}
.ph .code{position:absolute;right:10px;bottom:8px;font-size:.72rem;font-weight:700;letter-spacing:.06em;background:rgba(7,11,74,.72);color:#fff;border-radius:99px;padding:1px 9px}
.im .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.im h3{font-size:.95rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.84rem;color:var(--ink-2)}
.price{font-weight:700;font-size:1.12rem;color:var(--gold-text);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
.price small{font-weight:400;font-size:.78rem;color:var(--ink-2)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink);font:600 1rem var(--f-display);letter-spacing:.04em}
footer.foot{background:var(--navy);color:#DDE0F7;padding-block:28px}
footer.foot .wrap{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:center}
footer.foot b{color:var(--gold);font-family:var(--f-display);letter-spacing:.05em}footer.foot a{color:var(--gold-hi)}footer.foot small{display:block;opacity:.8}
#overlay{position:fixed;inset:0;background:rgba(7,11,74,.5);z-index:80;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 14px}
#overlay.on{display:flex}
.dlg{background:var(--surface);border-radius:14px;width:min(980px,100%);box-shadow:var(--shadow);margin:auto 0}
.dlg > header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg > header h2{font-size:1.05rem;overflow-wrap:anywhere}.dlg > header span{font-size:.84rem;color:var(--ink-2)}
.x{background:none;border:0;cursor:pointer;color:var(--ink-2);padding:4px;border-radius:6px;display:grid;flex:none}.x:hover{background:var(--surface-2)}.x svg{width:20px;height:20px}
.bd{padding:18px 20px}
.gal{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.gal .main{aspect-ratio:4/3;border-radius:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs button{width:64px;height:48px;padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--surface-2)}.thumbs button[aria-pressed="true"]{border-color:var(--gold)}.thumbs img{width:100%;height:100%;object-fit:cover}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.feat div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--ink-2)}.feat b{display:block;font:600 1rem var(--f-display);color:var(--navy)}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.box h3{font-size:.9rem;margin-bottom:10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.fields input,.fields select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;background:#fff}
.fields input:focus,.fields select:focus,.toolbar select:focus,.toolbar input:focus,.botin input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(228,187,97,.22)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#botFab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:var(--navy);border:0;border-radius:30px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
#botFab svg{width:20px;height:20px}
@media (max-width:640px){#botFab span{display:none}#botFab{padding:14px;border-radius:50%}#botFab svg{width:24px;height:24px}}
@media (max-width:640px){#botFab{bottom:max(92px,calc(env(safe-area-inset-bottom,0px) + 80px))}}
#bot{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:90;width:min(390px,calc(100vw - 32px));height:min(620px,calc(100% - 32px - env(safe-area-inset-top,0px)));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#bot > header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
#bot > header img{width:30px;height:auto;flex:none}#bot > header > div{flex:1;min-width:0}#bot > header b{display:block;font:600 .92rem/1.2 var(--f-display);letter-spacing:.03em}#bot > header span{display:block;font-size:.76rem;opacity:.85}
#bot > header .x{color:inherit}#bot > header .x:hover{background:rgba(255,255,255,.16)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.42;overflow-wrap:anywhere}
.msg.b{background:var(--surface-2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg .mini{display:block;width:100%;text-align:left;margin-top:7px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer}
.msg .mini:hover{border-color:var(--gold)}.msg .mini b{display:block;font-size:.88rem}.msg .mini span{font-size:.8rem;color:var(--ink-2)}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 14px;border-top:1px solid var(--line);max-height:42%;overflow:auto}
.botin{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.botin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px;z-index:99;font-size:.88rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;max-width:92vw}
#toast.on{opacity:1}
@media (max-width:760px){.gal{grid-template-columns:minmax(0,1fr)}.toolbar input{width:100%}.hero .cta .btn{flex:1 1 auto}}
@media (max-width:640px){#overlay{padding:0}.dlg{width:100%;border-radius:0;min-height:100%}#bot{left:0;bottom:92px;width:100%;height:calc(100% - 92px - env(safe-area-inset-top,0px));border-radius:16px 16px 0 0;border:0;border-bottom:1px solid var(--line)}.qr,.botin{padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="#" aria-label="Início"><img src="img/logo.png" alt="Lourenço's Brokers Soluções Imobiliárias"></a><a id="hWa" class="btn pri" target="_blank" rel="noopener">Falar no WhatsApp</a></div></header>
<section class="hero"><div class="wrap"><h1 id="hTitle">Seu imóvel em Jacareí</h1><p id="hText"></p><div class="cta"><button class="btn pri" id="hBot" type="button">Atendimento automático</button><a href="#imoveis" class="btn">Ver imóveis</a></div><small id="hCreci"></small></div></section>
<section class="list" id="imoveis"><div class="wrap">
  <div class="toolbar" id="toolbar"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="grid"></div>
</div></section>
<footer class="foot"><div class="wrap"><div><b id="fNome"></b><small id="fCreci"></small></div><div id="fContato"></div></div></footer>
<div id="overlay" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<button id="botFab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/></svg><span>Atendimento</span></button>
<section id="bot" hidden aria-label="Atendimento automático"></section>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(n==null||n===''||isNaN(+n))?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(+n);
const digits=s=>String(s||'').replace(/\D/g,'');
const maskTel=v=>{const d=digits(v).slice(0,11);if(d.length<=2)return d;if(d.length<=6)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
const IC={x:'M6 6l12 12M18 6L6 18',wa:'M4 20l1.3-4.2A8 8 0 1 1 8.2 18.8zM9 9c0 3 3 6 6 6l1.5-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z',bld:'M4 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M14 9h5a1 1 0 0 1 1 1v11M8 7h2M8 11h2M8 15h2M3 21h18',globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)};
let D={config:{},imoveis:[]};const C=()=>D.config;
const wa=msg=>{const d=digits(C().telefone);const n=d?(d.length<=11?'55'+d:d):'';return`https://wa.me/${n}?text=${encodeURIComponent(msg||'')}`};
const TIPOS=['Casa','Sobrado','Casa em condomínio','Apartamento','Terreno / Lote','Chácara','Sala comercial','Galpão'];
const U={fin:'venda',tipo:'',bairro:'',quartos:'',max:''};
const foto=i=>(i.fotos||[])[0];
const meta=i=>[i.quartos?i.quartos+(i.quartos>1?' quartos':' quarto'):'',i.vagas?i.vagas+(i.vagas>1?' vagas':' vaga'):'',(i.area_const||i.area_total)?(i.area_const||i.area_total)+' m²':''].filter(Boolean).join(' · ');
function preco(i,fin){const v=[];const f=fin||i.finalidade;if((f==='venda'||f==='ambos')&&i.valor_venda)v.push(`<div class="price">${brl(i.valor_venda)}</div>`);if((f==='locacao'||f==='ambos')&&i.valor_aluguel)v.push(`<div class="price">${brl(i.valor_aluguel)} <small>/ mês</small></div>`);return v.join('')||'<div class="price">Consulte</div>'}

/* ---------- lista ---------- */
function bairros(){return[...new Set(D.imoveis.filter(i=>i.finalidade===U.fin||i.finalidade==='ambos').map(i=>i.bairro).filter(Boolean))].sort()}
function drawToolbar(){
  $('#toolbar').innerHTML=`<div class="chips"><button class="chip" data-fin="venda" aria-pressed="${U.fin==='venda'}">Comprar</button><button class="chip" data-fin="locacao" aria-pressed="${U.fin==='locacao'}">Alugar</button></div>
  <select data-f="tipo" aria-label="Tipo"><option value="">Todos os tipos</option>${TIPOS.map(t=>`<option ${U.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
  <select data-f="bairro" aria-label="Bairro"><option value="">Todos os bairros</option>${bairros().map(b=>`<option ${U.bairro===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
  <select data-f="quartos" aria-label="Quartos"><option value="">Quartos</option>${[1,2,3,4].map(n=>`<option value="${n}" ${U.quartos==n?'selected':''}>${n}+ quartos</option>`).join('')}</select>
  <input type="number" min="0" data-f="max" value="${esc(U.max)}" placeholder="${U.fin==='venda'?'Valor máximo (R$)':'Aluguel máximo (R$)'}" aria-label="Valor máximo">`;
}
function filtered(){
  const campo=U.fin==='venda'?'valor_venda':'valor_aluguel';
  return D.imoveis.filter(i=>(i.finalidade===U.fin||i.finalidade==='ambos')&&(!U.tipo||i.tipo===U.tipo)&&(!U.bairro||i.bairro===U.bairro)&&(!U.quartos||(i.quartos||0)>=+U.quartos)&&(!U.max||(i[campo]||0)<=+U.max)).sort((a,b)=>(b.destaque?1:0)-(a.destaque?1:0));
}
function drawList(){
  const l=filtered();
  $('#count').textContent=l.length?`${l.length} ${l.length>1?'imóveis encontrados':'imóvel encontrado'}`:'';
  $('#grid').innerHTML=l.length?`<div class="cards">${l.map(i=>`<button class="im" data-open="${esc(i.codigo)}" aria-label="${esc(i.titulo)}"><div class="ph">${foto(i)?`<img loading="lazy" src="${esc(foto(i))}" alt="${esc(i.titulo)}">`:ic(/Terreno|Chácara/.test(i.tipo||'')?'globe':'bld')}${i.destaque?'<span class="tag"><span class="pill">Destaque</span></span>':''}<span class="code">${esc(i.codigo)}</span></div><div class="body"><h3>${esc(i.titulo)}</h3><div class="meta">${esc(i.tipo||'')}${i.bairro?' · '+esc(i.bairro):''}</div>${preco(i,U.fin)}<div class="meta">${esc(meta(i))}</div></div></button>`).join('')}</div>`:`<div class="empty"><b>Nenhum imóvel com esses critérios</b><span>Fale com a corretoria e descreva o que você procura.</span><a class="btn pri" target="_blank" rel="noopener" href="${wa('Olá! Estou procurando um imóvel em Jacareí.')}">Chamar no WhatsApp</a></div>`;
}

/* ---------- detalhe ---------- */
let cur=null;
function openDetail(cod,fromHash){
  const i=D.imoveis.find(x=>x.codigo===cod);if(!i)return;cur=i;
  const f=i.fotos||[];
  $('#overlay').innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(i.titulo)}"><header><div><h2>${esc(i.titulo)}</h2><span>${esc(i.codigo)} · ${esc(i.tipo||'')} · ${esc(i.bairro||'')}, ${esc(i.cidade||'Jacareí')}</span></div><button class="x" data-close aria-label="Fechar">${ic('x')}</button></header>
  <div class="bd"><div class="gal"><div><div class="ph main" id="galMain">${f[0]?`<img src="${esc(f[0])}" alt="${esc(i.titulo)}">`:ic('bld')}</div>${f.length>1?`<div class="thumbs">${f.map((p,n)=>`<button data-gal="${n}" aria-pressed="${n===0}" aria-label="Foto ${n+1}"><img src="${esc(p)}" alt=""></button>`).join('')}</div>`:''}</div>
  <div>${preco(i,U.fin)}${(i.condominio||i.iptu)?`<div class="meta">${i.condominio?'Condomínio '+brl(i.condominio):''}${i.condominio&&i.iptu?' · ':''}${i.iptu?'IPTU '+brl(i.iptu):''}</div>`:''}
  <div class="feat">${[['Quartos',i.quartos],['Suítes',i.suites],['Banheiros',i.banheiros],['Vagas',i.vagas],['Área total',i.area_total?i.area_total+' m²':''],['Construída',i.area_const?i.area_const+' m²':'']].filter(x=>x[1]).map(([l,v])=>`<div><b>${esc(v)}</b>${l}</div>`).join('')}</div>
  <p style="white-space:pre-line;margin:0">${esc(i.descricao||'')}</p>
  <div class="box"><h3>Agendar visita</h3><div class="fields"><label>Dia<input type="date" id="svD" min="${new Date().toISOString().slice(0,10)}"></label><label>Período<select id="svP"><option>manhã</option><option>tarde</option><option>noite</option></select></label></div>
  <div class="row"><a id="svLink" class="btn pri" target="_blank" rel="noopener">${ic('wa')}<span>Pedir informações</span></a><button class="btn" data-share type="button">Copiar link do imóvel</button></div></div></div></div></div></div>`;
  $('#overlay').classList.add('on');document.body.style.overflow='hidden';svLink();
  if(!fromHash)try{history.replaceState(null,'','#imovel-'+i.codigo)}catch(e){}
}
function svLink(){
  if(!cur)return;const d=$('#svD').value,p=$('#svP').value;
  const base=`${cur.codigo} – ${cur.titulo} (${cur.bairro||''})`;
  const msg=d?`Olá! Gostaria de agendar uma visita ao imóvel ${base} no dia ${d.split('-').reverse().join('/')}, período da ${p}.`:`Olá! Tenho interesse no imóvel ${base}. Pode me passar mais informações?`;
  const a=$('#svLink');a.href=wa(msg);a.querySelector('span').textContent=d?'Solicitar esta visita':'Pedir informações';
}
function closeDetail(){$('#overlay').classList.remove('on');$('#overlay').innerHTML='';document.body.style.overflow='';cur=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}

/* ---------- atendimento automático ---------- */
const TIPO_G={casa:['Casa','Sobrado','Casa em condomínio'],apto:['Apartamento'],terreno:['Terreno / Lote'],chacara:['Chácara'],comercial:['Sala comercial','Galpão']};
const FAIXAS={venda:[[0,300000,'Até R$ 300 mil'],[300000,500000,'R$ 300 a 500 mil'],[500000,800000,'R$ 500 a 800 mil'],[800000,1e12,'Acima de R$ 800 mil']],locacao:[[0,1500,'Até R$ 1.500'],[1500,2500,'R$ 1.500 a 2.500'],[2500,4000,'R$ 2.500 a 4.000'],[4000,1e12,'Acima de R$ 4.000']]};
const FLOWS={comprar:['tipo','bairro','quartos','faixa','pagto','prazo','nome','tel'],alugar:['tipo','bairro','quartos','faixa','prazo','nome','tel'],vender:['tipoV','bairroV','valorV','docs','prazoV','nome','tel'],captar:['tipoV','bairroV','valorV','docs','prazoV','nome','tel'],humano:['nome','tel']};
const LBL={tipo:'Tipo',tipoV:'Tipo do imóvel',bairro:'Bairro',bairroV:'Bairro do imóvel',quartos:'Quartos (mín.)',faixa:'Faixa de valor',pagto:'Pagamento',prazo:'Prazo',prazoV:'Prazo',valorV:'Valor esperado',docs:'Escritura/matrícula regularizada'};
const INT={comprar:'Quer comprar um imóvel',alugar:'Quer alugar um imóvel',vender:'Quer vender o seu imóvel',captar:'Quer alugar o seu imóvel',humano:'Quer falar com um corretor'};
let B=null;
function Q(k){
  const a=B.ans,it=a.intent&&a.intent.v,fin=it==='comprar'?'venda':'locacao';
  const bs=[...new Set(D.imoveis.filter(i=>i.finalidade===fin||i.finalidade==='ambos').map(i=>i.bairro).filter(Boolean))].sort().slice(0,6);
  const prazo={t:'Para quando você precisa?',o:[['urgente','O quanto antes'],['3m','Em até 3 meses'],['pesq','Estou só pesquisando']]};
  const q={
   intent:{t:'O que você procura hoje?',o:[['comprar','Comprar um imóvel'],['alugar','Alugar um imóvel'],['vender','Vender o meu imóvel'],['captar','Alugar o meu imóvel'],['humano','Falar com um corretor']]},
   tipo:{t:'Que tipo de imóvel você procura?',o:[['casa','Casa ou sobrado'],['apto','Apartamento'],['terreno','Terreno'],['chacara','Chácara'],['comercial','Comercial'],['any','Tanto faz']]},
   bairro:{t:'Tem preferência de bairro?',o:[...bs.map(b=>[b,b]),['any','Qualquer bairro']],skip:()=>!bs.length},
   quartos:{t:'Quantos quartos, no mínimo?',o:[['1','1'],['2','2'],['3','3'],['4','4 ou mais'],['0','Tanto faz']],skip:()=>a.tipo&&['terreno','comercial'].includes(a.tipo.v)},
   faixa:{t:fin==='venda'?'Qual faixa de valor você pretende investir?':'Qual faixa de aluguel cabe no seu orçamento?',o:FAIXAS[fin].map((f,i)=>[String(i),f[2]]).concat([['any','Ainda não sei']])},
   pagto:{t:'Como pretende pagar?',o:[['avista','À vista'],['financ','Financiamento'],['fgts','Financiamento com FGTS'],['permuta','Tenho imóvel para dar na troca']]},
   prazo,prazoV:prazo,
   tipoV:{t:'Que tipo de imóvel é o seu?',o:[['casa','Casa ou sobrado'],['apto','Apartamento'],['terreno','Terreno'],['chacara','Chácara'],['comercial','Comercial']]},
   bairroV:{t:'Em qual bairro ele fica?',text:1,ph:'Ex.: Jardim Esper'},
   valorV:{t:it==='vender'?'Quanto você gostaria de receber pelo imóvel? Pode pular.':'Qual aluguel você espera receber? Pode pular.',text:1,ph:'Ex.: 450000',money:1,skipBtn:1},
   docs:{t:'O imóvel tem escritura ou matrícula regularizada?',o:[['sim','Sim'],['nao','Não'],['ns','Não sei']]},
   nome:{t:'Como posso te chamar?',text:1,ph:'Seu nome'},
   tel:{t:'Qual o melhor WhatsApp para o corretor falar com você?',text:1,ph:'(12) 99999-9999',tel:1}
  };return q[k];
}
const say=h=>B.msgs.push({b:1,h});
function botStart(){B={open:true,msgs:[],ans:{},i:0,cur:'intent',done:false,matches:[]};say(esc((C().botSaudacao||'Olá! Sou o assistente virtual da {nome}. Vou fazer algumas perguntas rápidas para encontrar o imóvel certo para você.').replace('{nome}',C().nome||'corretoria')));say(esc(Q('intent').t));drawBot()}
function advance(){const flow=FLOWS[B.ans.intent.v];while(B.i<flow.length){const q=Q(flow[B.i]);if(q.skip&&q.skip()){B.i++;continue}B.cur=flow[B.i];say(esc(q.t));return}B.cur=null;finish()}
function reply(v,l){if(!B||B.done||!B.cur)return;B.msgs.push({b:0,h:esc(l)});B.ans[B.cur]={v,l};if(B.cur==='intent')B.i=0;else B.i++;advance();drawBot()}
function textIn(txt,skip){
  if(!B||!B.cur)return;const q=Q(B.cur);if(!skip&&!txt)return;
  if(q.tel&&digits(txt).length<10){say('Preciso do número com DDD, por exemplo (12) 99999-9999.');drawBot();return}
  let v=txt,l=txt;
  if(q.money){if(skip){v='';l='Prefiro conversar sobre isso'}else{const n=+digits(txt);if(!n){say('Digite só o valor em reais, por exemplo 450000, ou toque em Pular.');drawBot();return}v=String(n);l=brl(n)}}
  B.msgs.push({b:0,h:esc(l)});B.ans[B.cur]={v,l};B.i++;advance();drawBot();
}
function matches(a){
  const fin=a.intent.v==='comprar'?'venda':'locacao',campo=fin==='venda'?'valor_venda':'valor_aluguel';
  const base=D.imoveis.filter(i=>i.finalidade===fin||i.finalidade==='ambos');
  const tipoOk=i=>!a.tipo||a.tipo.v==='any'||(TIPO_G[a.tipo.v]||[]).includes(i.tipo);
  const f=a.faixa&&a.faixa.v!=='any'?FAIXAS[fin][+a.faixa.v]:null;
  const precoOk=i=>!f||((i[campo]||0)>=f[0]*.9&&(i[campo]||0)<=f[1]*1.1);
  const bairroOk=i=>!a.bairro||a.bairro.v==='any'||i.bairro===a.bairro.v;
  const qOk=i=>!a.quartos||+a.quartos.v===0||(i.quartos||0)>=+a.quartos.v;
  let n=0,l=base.filter(i=>tipoOk(i)&&precoOk(i)&&bairroOk(i)&&qOk(i));
  if(!l.length){n=1;l=base.filter(i=>tipoOk(i)&&precoOk(i))}
  if(!l.length){n=2;l=base.filter(tipoOk)}
  return{list:l.sort((x,y)=>(y.destaque?1:0)-(x.destaque?1:0)).slice(0,3),nivel:n,fin};
}
function summary(){
  const a=B.ans,it=a.intent.v;
  const L=[`Atendimento automático pelo site · ${C().nome||''}`,`Nome: ${a.nome?a.nome.v:'—'}`,`WhatsApp: ${a.tel?a.tel.v:'—'}`,`Interesse: ${INT[it]}`];
  Object.keys(LBL).forEach(k=>{if(a[k]&&a[k].v!=='')L.push(`${LBL[k]}: ${a[k].l}`)});
  if(B.matches.length)L.push('Imóveis sugeridos: '+B.matches.map(i=>i.codigo).join(', '));
  const pr=a.prazo||a.prazoV;if(pr&&pr.v==='urgente')L.push('Prioridade: alta (precisa o quanto antes)');
  return L.join('\n');
}
function finish(){
  const a=B.ans,it=a.intent.v,nome=(a.nome&&a.nome.v||'').split(' ')[0];
  if(it==='comprar'||it==='alugar'){
    const r=matches(a);B.matches=r.list;U.fin=r.fin;
    const cards=r.list.map(i=>`<button class="mini" data-open="${esc(i.codigo)}"><b>${esc(i.titulo)}</b><span>${esc(i.codigo)} · ${esc(i.bairro||'')} · ${r.fin==='venda'?brl(i.valor_venda):brl(i.valor_aluguel)+'/mês'}</span></button>`).join('');
    if(r.list.length)say(`Obrigado, ${esc(nome)}! ${r.nivel===0?'Encontrei estas opções com o seu perfil:':r.nivel===1?'Nada igual ao pedido, mas estas ficam perto do que você descreveu:':'Nessa faixa não tenho nada agora. Estas do mesmo tipo podem interessar:'}${cards}`);
    else say(`Obrigado, ${esc(nome)}! Hoje não tenho um imóvel com esse perfil publicado, mas o corretor busca nas indicações da corretoria e avisa você.`);
  }else if(it==='humano')say(`Combinado, ${esc(nome)}.`);
  else say(`Obrigado, ${esc(nome)}! Com essas informações o corretor prepara uma avaliação do seu imóvel.`);
  say('Montei o resumo do seu atendimento. Toque em enviar para o corretor continuar a conversa pelo WhatsApp.');
  B.done=true;B.summary=summary();drawToolbar();drawList();
}
function drawBot(){
  const el=$('#bot');if(!B||!B.open){el.hidden=true;$('#botFab').hidden=false;return}
  const keep=$('#botIn')?$('#botIn').value:'';const q=!B.done&&B.cur?Q(B.cur):null;let foot='';
  if(B.done)foot=`<div class="qr"><a class="btn pri" target="_blank" rel="noopener" href="${wa(B.summary)}">${ic('wa')}Enviar ao corretor</a><button class="btn" data-bot="restart">Novo atendimento</button></div>`;
  else if(q&&q.o)foot=`<div class="qr">${q.o.map(([v,l])=>`<button class="chip" data-bot="reply" data-v="${esc(v)}" data-l="${esc(l)}">${esc(l)}</button>`).join('')}</div>`;
  else if(q&&q.text)foot=`<form class="botin" id="botForm" autocomplete="off"><input id="botIn" ${q.tel?'type="tel"':'type="text"'} placeholder="${esc(q.ph||'')}" aria-label="Sua resposta"><button class="btn pri" type="submit">Enviar</button>${q.skipBtn?'<button class="btn" type="button" data-bot="skip">Pular</button>':''}</form>`;
  el.innerHTML=`<header><img src="img/icone.png" alt=""><div><b>Assistente da ${esc((C().nome||'corretoria').split(' Soluções')[0])}</b><span>Atendimento automático</span></div><button class="x" data-bot="close" aria-label="Fechar atendimento">${ic('x')}</button></header><div class="msgs" id="botMsgs">${B.msgs.map(m=>`<div class="msg ${m.b?'b':'me'}">${m.h}</div>`).join('')}</div>${foot}`;
  el.hidden=false;$('#botFab').hidden=true;
  const m=$('#botMsgs');m.scrollTop=m.scrollHeight;const inp=$('#botIn');if(inp){inp.value=keep;inp.focus({preventScroll:true})}
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let n;
  if(n=t.closest('[data-fin]')){U.fin=n.dataset.fin;U.bairro='';drawToolbar();drawList()}
  else if(n=t.closest('[data-open]')){openDetail(n.dataset.open)}
  else if(t.closest('[data-close]')||t.id==='overlay')closeDetail();
  else if(n=t.closest('[data-gal]')){const i=cur.fotos[+n.dataset.gal];$('#galMain').innerHTML=`<img src="${esc(i)}" alt="">`;document.querySelectorAll('.thumbs button').forEach((b,k)=>b.setAttribute('aria-pressed',k===+n.dataset.gal))}
  else if(t.closest('[data-share]')){const u=location.href.split('#')[0]+'#imovel-'+cur.codigo;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copiado.'),()=>toast(u))}
  else if(n=t.closest('[data-bot]')){const a=n.dataset.bot;if(a==='reply')reply(n.dataset.v,n.dataset.l);else if(a==='close'){B.open=false;drawBot()}else if(a==='restart')botStart();else if(a==='skip')textIn('',true)}
  else if(t.closest('#botFab')||t.closest('#hBot')){if(!B)botStart();else{B.open=true;drawBot()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){U[t.dataset.f]=t.value;drawList();if(t.dataset.f==='tipo'||t.dataset.f==='quartos'){}}
  else if(t.id==='svD'||t.id==='svP')svLink();
  else if(t.id==='botIn'&&t.type==='tel')t.value=maskTel(t.value);
});
document.addEventListener('submit',e=>{if(e.target.id==='botForm'){e.preventDefault();textIn($('#botIn').value.trim(),false)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(cur)closeDetail();else if(B&&B.open){B.open=false;drawBot()}}});
function fromHash(){const m=location.hash.match(/^#imovel-(.+)$/);if(m)openDetail(decodeURIComponent(m[1]),true)}
window.addEventListener('hashchange',()=>{if(/^#imovel-/.test(location.hash))fromHash();else if(cur)closeDetail()});

/* ---------- início ---------- */
function paint(){
  const c=C();
  $('#hTitle').textContent=c.headline||'Seu imóvel em Jacareí';
  $('#hText').textContent=c.sobre||'';
  $('#hCreci').textContent=[c.creci,(c.cidade||'Jacareí')+'/SP'].filter(Boolean).join(' · ');
  $('#hWa').href=wa('Olá! Vi o site da '+(c.nome||'corretoria')+' e gostaria de atendimento.');
  $('#fNome').textContent=c.nome||'';$('#fCreci').textContent=[c.creci,c.endereco].filter(Boolean).join(' · ');
  $('#fContato').innerHTML=[c.telefone?`<div>WhatsApp: <a target="_blank" rel="noopener" href="${wa('')}">${esc(c.telefone)}</a></div>`:'',c.email?`<div>${esc(c.email)}</div>`:''].join('');
  document.title=(c.nome?c.nome.split(' Soluções')[0]:'Imóveis')+' · Imóveis em '+(c.cidade||'Jacareí');
}
fetch('dados.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{D=j;paint();drawToolbar();drawList();fromHash()}).catch(()=>{$('#grid').innerHTML='<div class="empty"><b>Não foi possível carregar os imóveis</b><span>Publique a pasta completa (index.html, dados.json e a pasta img) em um servidor, como o Netlify.</span></div>'});
</script>
</body>
