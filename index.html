<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lourenço's Brokers Gestão</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style id="appcss">
/* Layout: sidebar azul-marinho fixa + área de trabalho; no celular vira barra superior + abas inferiores. */
:root{
  --navy:#070B4A; --navy-deep:#050838; --gold:#E4BB61; --gold-hi:#F5DC8E; --gold-lo:#B98A2E;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F5FA; --line:#E2E4EE; --fg:#14173F; --muted:#5E6389;
  --gold-text:#8A5E0C; --ink:#070B4A; --ok:#0F7F58; --warn:#8F6200; --bad:#BE3A2C; --info:#2D52C6;
  --side-bg:#FFFFFF; --side-fg:#14173F; --side-muted:#5E6389; --nav-hover:rgba(7,11,74,.05); --nav-active:#070B4A;
  --ph-bg:linear-gradient(145deg,#F6F7FB,#E6E9F4); --ph-fg:#B98A2E;
  --shadow:0 10px 30px rgba(10,15,74,.12);
  --f-display:'Cinzel',Georgia,serif; --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
/* Tema claro por padrão; o escuro só entra quando a pessoa escolhe no botão de tema. */
:root[data-theme="dark"]{
  --bg:#080C45; --surface:#0F1558; --surface-2:#171E70; --line:#2A3290; --fg:#EEF0FB; --muted:#A5ACDB;
  --gold-text:#E4BB61; --ok:#5BD6A0; --warn:#F2B84B; --bad:#FF8C8C; --info:#8DB0FF;
  --side-bg:#050838; --side-fg:#EEF0FB; --side-muted:#B9BFE8; --nav-hover:rgba(255,255,255,.06); --nav-active:#E4BB61;
  --ph-bg:linear-gradient(145deg,#0E1560,#070B4A); --ph-fg:rgba(228,187,97,.55);
  --shadow:0 10px 30px rgba(0,0,20,.45); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
img{max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* estrutura */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;gap:20px;padding-block:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line)}
.side .logo{width:176px;display:block}
.side nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;border:0;background:none;color:var(--side-muted);cursor:pointer;text-align:left;font-weight:500}
.nv:hover{background:var(--nav-hover);color:var(--side-fg)}
.nv[aria-current="page"]{background:linear-gradient(90deg,rgba(228,187,97,.30),rgba(228,187,97,.05));color:var(--nav-active);box-shadow:inset 3px 0 0 var(--gold)}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:6px;color:var(--side-muted);font-size:12.5px}
.side-f .nv{padding:8px 12px;font-size:13.5px}
.col{min-width:0;display:flex;flex-direction:column}
.top{display:none}
.main{padding-block:26px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1240px}
.tabbar{display:none}
.vh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vh h1{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;font-weight:600}
.vh-a{display:flex;gap:8px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13.5px;margin:-10px 0 18px}

/* botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:var(--ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;color:inherit}
.ib:hover{background:var(--surface-2)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span,.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],input[type=search],select,textarea,.f input{width:100%;min-width:0;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(228,187,97,.22)}
.chk{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;padding:6px 0}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid .s2{grid-column:span 2}.grid .s3{grid-column:span 3}.grid .s4{grid-column:1/-1}
.grp{border:0;margin:0;padding:0;min-width:0}
.grp>h4{font-family:var(--f-display);letter-spacing:.05em;font-size:14px;color:var(--gold-text);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tb .f{flex:1 1 150px}
.tb .grow{flex:2 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}

/* cartões e pílulas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--fg);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--ok)}.pill.warn::before{background:var(--warn)}.pill.bad::before{background:var(--bad)}.pill.info::before{background:var(--info)}.pill.gold::before{background:var(--gold)}
.pill.flat::before{display:none}
.muted{color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:18px;font-size:14px}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;color:var(--gold-text)}
.kpi .l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .d{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.card h3{font-family:var(--f-display);font-size:15px;letter-spacing:.05em;margin-bottom:12px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.bar i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi))}
.bar div{background:var(--surface-2);border-radius:5px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

/* imóveis */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.im{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;padding:0;text-align:left;color:inherit}
.im:hover{border-color:var(--gold)}
.ph{position:relative;aspect-ratio:4/3;background:var(--ph-bg);display:grid;place-items:center;color:var(--ph-fg);overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;left:10px;top:10px;z-index:1}
.ph .cod{position:absolute;left:10px;bottom:10px;z-index:1;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#fff;background:rgba(7,11,74,.72);padding:2px 9px;border-radius:99px}
.im .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.im .tt{font-weight:600}
.im .pr{font-weight:700;color:var(--gold-text);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:92px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1}

/* crm */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity;align-items:flex-start}
.kc{flex:0 0 268px;scroll-snap-align:start;background:var(--surface-2);border-radius:12px;padding:10px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.kc.over{outline:2px dashed var(--gold)}
.kc>h3{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between;color:var(--muted);padding:2px 4px}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;color:inherit}
.lc:hover{border-color:var(--gold)}
.lc .n{font-weight:600}
.lc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.lc .go{align-self:flex-end}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;min-width:620px}
.tbl th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr[data-id]{cursor:pointer}.tbl tr[data-id]:hover td{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tl{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow:auto;margin:8px 0}
.tl div{padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:14px}
.tl small{display:block;color:var(--muted);font-size:12px}
.hint{font-size:13px;color:var(--muted)}
.late{color:var(--bad);font-weight:600}.today{color:var(--warn);font-weight:600}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,5,30,.66);display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:760px;max-height:94vh;max-height:94dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet.wide{max-width:900px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-h h2{font-family:var(--f-display);font-size:17px;letter-spacing:.04em}
.sh-b{overflow:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 20px max(18px,env(safe-area-inset-left,0px));flex:1}
.sh-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.sh-f .sp{margin-right:auto}
@media (min-width:861px){.ov{align-items:center;padding:24px}.sheet{border-radius:16px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}

/* vistoria */
.amb{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.amb>header{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface-2)}
.amb>header input{font-weight:600}
.it{display:grid;grid-template-columns:minmax(0,1.3fr) 110px minmax(0,1.5fr) 32px;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
.it .nm{font-size:14px;border-color:transparent;background:transparent;padding-left:2px}.it .nm:focus{background:var(--bg)}.it .ant{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--gold)}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 130px 32px;gap:8px;margin-bottom:8px}
.ln-t{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-top:6px}

/* papel (documentos) */
.sheetnote{font-size:13px;color:var(--muted);margin:0 0 10px}
.paper{background:#fff;color:#14163a;font-family:'Source Serif 4',Georgia,serif;font-size:13.5px;line-height:1.6;padding:34px 40px;max-width:794px;margin:0 auto;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.paper h1{font-family:'Cinzel',Georgia,serif;font-size:22px;letter-spacing:.08em;margin:0;color:#070B4A}
.paper h2{font-family:'Cinzel',Georgia,serif;font-size:15px;letter-spacing:.06em;text-align:center;margin:6px 0 16px;color:#070B4A}
.paper h3{font-size:13.5px;margin:14px 0 4px;color:#070B4A;text-transform:uppercase;letter-spacing:.04em}
.paper p{margin:0 0 9px;text-align:justify}
.paper .p-head{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid #E4BB61;padding-bottom:12px;margin-bottom:18px}
.paper .p-head img{height:62px;width:auto;max-width:48%}
.paper .p-head .r{text-align:right}
.paper .p-valor{font-family:'Cinzel',Georgia,serif;font-size:24px;font-weight:700;text-align:center;border:2px solid #070B4A;border-radius:6px;padding:8px;margin:0 0 16px;color:#070B4A}
.paper table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:12.5px}
.paper th,.paper td{border:1px solid #c9ccdf;padding:5px 8px;text-align:left;vertical-align:top}
.paper th{background:#eef0f9;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.paper td.r,.paper th.r{text-align:right}
.paper .p-sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:30px 28px;margin-top:38px}
.paper .p-sign div{border-top:1px solid #14163a;padding-top:5px;text-align:center;font-size:12.5px;line-height:1.35}
.paper .p-local{margin-top:20px;text-align:right}
.paper .p-foot{margin-top:26px;padding-top:8px;border-top:1px solid #c9ccdf;font-size:11px;color:#555a85;text-align:center}
.paper .est{font-weight:700}.paper .e-ok{color:#0b7a50}.paper .e-bad{color:#b53225}.paper .e-reg{color:#8a5e0c}
.paper .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 18px;margin-bottom:10px;font-size:12.5px}
.paper .kv b{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#555a85}

/* site */
.site{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.standalone .site{border:0;border-radius:0;min-height:100vh}
.s-top{background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px max(20px,env(safe-area-inset-left,0px))}
.s-top img{height:46px;width:auto}
.s-top .btn{color:var(--fg);border-color:var(--gold);background:transparent}
.s-hero{background:radial-gradient(900px 300px at 85% -30%,rgba(228,187,97,.30),transparent),linear-gradient(180deg,var(--surface),var(--surface-2));color:var(--fg);border-bottom:1px solid var(--line);padding:44px max(20px,env(safe-area-inset-left,0px)) 56px}
.s-hero h2{font-family:var(--f-display);font-size:clamp(26px,5vw,42px);letter-spacing:.03em;line-height:1.15;max-width:15em}
.s-hero p{color:var(--muted);max-width:34em;margin:10px 0 22px}
.s-search{background:var(--surface);color:var(--fg);border-radius:14px;padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:end;max-width:880px;box-shadow:var(--shadow);border:1px solid var(--line)}
.s-search .f{flex:1 1 150px}
.s-tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px}
.s-tabs button{border:0;background:none;padding:8px 14px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.s-tabs button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.s-body{padding:26px max(20px,env(safe-area-inset-left,0px)) 30px}
.s-bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px}
.s-bh h3{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}
.s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.s-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.s-card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.s-card .loc{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.s-card .tt{font-family:var(--f-display);font-size:16px;letter-spacing:.02em}
.s-card .pr{font-size:19px;font-weight:700;color:var(--gold-text);font-variant-numeric:tabular-nums}
.s-card .pr small{font-size:12px;color:var(--muted);font-weight:500}
.s-specs{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.s-card details{font-size:14px}
.s-card summary{cursor:pointer;color:var(--gold-text);font-weight:600;font-size:13.5px}
.s-card details p{margin:8px 0}
.s-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.s-strip img{height:90px;border-radius:6px}
.s-card .btn{margin-top:auto;text-decoration:none;align-self:stretch}
.s-empty{padding:40px 16px;text-align:center;color:var(--muted)}
.s-foot{background:var(--surface-2);color:var(--muted);border-top:1px solid var(--line);padding:26px max(20px,env(safe-area-inset-left,0px));display:flex;gap:18px 40px;flex-wrap:wrap;font-size:14px;line-height:1.6}
.s-foot b{color:var(--gold-text);display:block;font-family:var(--f-display);letter-spacing:.05em;margin-bottom:2px}
[hidden]{display:none!important}

@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{display:block}
  .side{display:none}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--side-bg);color:var(--side-fg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side-bg);z-index:30}
  .top img{height:34px;width:auto}
  .top .ib{color:var(--side-fg)}
  .main{padding-block:18px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:5px 0;cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--gold-text)}
  .vh h1{font-size:22px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .s3,.grid .s4{grid-column:1/-1}
  .it{grid-template-columns:minmax(0,1fr) 104px 32px}.it .nm{grid-column:1}.it select{grid-column:2}.it .rm{grid-column:3;grid-row:1}.it .ob{grid-column:1/-1;grid-row:2}
  .paper{padding:22px 18px}
}
@media (max-width:520px){.kpis{gap:8px}.kpi{padding:12px}.kpi .v{font-size:24px}.bar{grid-template-columns:92px 1fr 24px}.paper .p-head{flex-direction:column;align-items:flex-start}.paper .p-head .r{text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function extenso(v){
  v=Math.round(Number(v||0)*100)/100;const reais=Math.floor(v),cent=Math.round((v-reais)*100);
  const U=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
  const D=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
  const C=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const t=n=>{if(!n)return'';if(n===100)return'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(C[c]);if(r){if(r<20)p.push(U[r]);else{const d=Math.floor(r/10),u=r%10;p.push(D[d]+(u?' e '+U[u]:''))}}return p.join(' e ')};
  const g=n=>{if(n===0)return'zero';const ps=[],bi=Math.floor(n/1e9),mi=Math.floor(n%1e9/1e6),mil=Math.floor(n%1e6/1e3),r=n%1e3;
    if(bi)ps.push(t(bi)+(bi===1?' bilhão':' bilhões'));if(mi)ps.push(t(mi)+(mi===1?' milhão':' milhões'));
    if(mil)ps.push(mil===1?'mil':t(mil)+' mil');if(r)ps.push(t(r));
    if(ps.length===1)return ps[0];const last=ps.pop();const lastVal=r||mil*1000||mi*1e6;
    const simples=r?(r<100||r%100===0):true;
    return ps.join(', ')+(simples?' e ':', ')+last};
  const out=[];
  if(reais>0)out.push(g(reais)+((reais%1e6===0&&reais>=1e6)?' de ':' ')+(reais===1?'real':'reais'));
  if(cent>0)out.push(g(cent)+' '+(cent===1?'centavo':'centavos'));

   }});

async function shrink(file,max=1280){const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('x')),'image/jpeg',.8))}

      :g==='Título de capitalização'?'A garantia é prestada por título de capitalização, na modalidade de cessão fiduciária, em valor não inferior a 12 (doze) vezes o aluguel mensal, mantido pelo LOCATÁRIO durante toda a locação (art. 37, IV, da Lei 8.245/91).'

    body=`<p>Pelo presente instrumento particular, de um lado ${parte(k.a)}, doravante denominado(a) <b>LOCADOR(A)</b>, e de outro ${parte(k.b)}, doravante denominado(a) <b>LOCATÁRIO(A)</b>, com a intermediação de <b>${esc(c.empresa)}</b>, CRECI ${esc(c.crecij)}, doravante <b>IMOBILIÁRIA</b>, têm entre si justo e contratado o seguinte, nos termos da Lei nº 8.245/91:</p>

    <h3>Cláusula 7ª – Da conservação</h3><p>O LOCATÁRIO obriga-se a conservar o imóvel e a restituí-lo no estado em que o recebeu, ressalvado o desgaste natural pelo uso normal (art. 23, III). É vedado sublocar, ceder ou emprestar o imóvel, total ou parcialmente, sem consentimento prévio e escrito do LOCADOR (art. 13). Benfeitorias necessárias serão indenizáveis; as úteis, somente se previamente autorizadas; as voluptuárias não serão indenizadas, podendo ser retiradas se não danificarem o imóvel (arts. 35 e 36).</p>
    <h3>Cláusula 8ª – Da rescisão</h3><p>A parte que descumprir qualquer cláusula ficará sujeita a multa equivalente a <b>${esc(k.multa??3)} (${esc(extenso(k.multa??3).replace(' reais','').replace(' real',''))}) aluguéis</b> vigentes, calculada proporcionalmente ao período de cumprimento do contrato (art. 4º da Lei 8.245/91), sem prejuízo da ação de despejo em caso de inadimplemento (art. 9º). O LOCATÁRIO fica dispensado da multa quando a devolução decorrer de transferência de emprego, nos termos do parágrafo único do art. 4º.</p>
    <h3>Cláusula 9ª – Da alienação do imóvel</h3><p>Em caso de venda, o LOCATÁRIO terá direito de preferência em igualdade de condições (art. 27). O LOCATÁRIO somente terá direito à continuidade da locação se este contrato contiver cláusula de vigência e estiver averbado na matrícula do imóvel (art. 8º).</p>
    <h3>Cláusula 10ª – Da devolução</h3><p>Para a devolução, o LOCATÁRIO comunicará a IMOBILIÁRIA por escrito, entregará as chaves e comprovantes de quitação das contas de consumo, e o imóvel será vistoriado. O aluguel e encargos serão devidos até a data da efetiva entrega das chaves.</p>
    ${k.extras?`<h3>Cláusulas adicionais</h3><p>${esc(k.extras).replace(/\n/g,'<br>')}</p>`:''}
    <h3>Do foro</h3><p>Fica eleito o foro da comarca de <b>${esc(k.foro||c.foro)}</b> para dirimir quaisquer questões deste contrato, com renúncia a qualquer outro, por mais privilegiado que seja.</p>
    <p>E, por estarem assim justas e contratadas, as partes assinam este instrumento em 2 (duas) vias de igual teor, na presença de 2 (duas) testemunhas.</p>${loc_}
    <div class="p-sign">${sig(k.a&&k.a.nome,'LOCADOR(A)')}${sig(k.b&&k.b.nome,'LOCATÁRIO(A)')}${g==='Fiador'?sig(k.fiador&&k.fiador.nome,'FIADOR(A)'):''}${sig(c.empresa,`IMOBILIÁRIA · CRECI ${esc(c.crecij)}`)}${testem}</div>`;
  }else if(k.tipo==='venda'){
    T='INSTRUMENTO PARTICULAR DE COMPRA E VENDA DE IMÓVEL';const saldo=(k.valor||0)-(k.sinal||0);
    body=`<p>Pelo presente instrumento particular, de um lado ${parte(k.a)}, doravante <b>VENDEDOR(A)</b>, e de outro ${parte(k.b)}, doravante <b>COMPRADOR(A)</b>, com a intermediação de <b>${esc(c.empresa)}</b>, CRECI ${esc(c.crecij)}, ajustam a compra e venda do imóvel abaixo, mediante as cláusulas seguintes:</p>
    <h3>Cláusula 1ª – Do objeto</h3><p>O VENDEDOR é legítimo proprietário e possuidor do seguinte imóvel: ${imvDesc(i)}, que vende ao COMPRADOR, livre e desembaraçado de ônus, dívidas, hipotecas, penhoras ou quaisquer gravames, ressalvados os expressamente declarados neste instrumento.</p>
    <h3>Cláusula 2ª – Do preço e da forma de pagamento</h3><p>O preço total da venda é de ${money(k.valor||0)}, pago da seguinte forma: ${k.sinal?`a título de sinal e princípio de pagamento, ${money(k.sinal)}, pagos neste ato, dando o VENDEDOR a respectiva quitação; `:''}${saldo>0?`saldo de ${money(saldo)} ${k.formaPgto?esc(k.formaPgto):'a ser pago na assinatura da escritura definitiva'}.`:'quitação integral neste ato.'}</p>
    <h3>Cláusula 3ª – Da escritura e do registro</h3><p>A escritura pública definitiva será lavrada em cartório de notas escolhido pelo COMPRADOR, em até 60 (sessenta) dias contados da assinatura, ou da aprovação do financiamento, se houver, comprometendo-se o VENDEDOR a fornecer toda a documentação e certidões necessárias. Correm por conta do COMPRADOR o ITBI, emolumentos de escritura e registro; correm por conta do VENDEDOR as certidões, a regularização de eventuais pendências e o imposto sobre ganho de capital, se devido.</p>
    <h3>Cláusula 4ª – Da posse e dos débitos</h3><p>A posse será transmitida ao COMPRADOR em ${k.formaPgto&&/posse/i.test(k.formaPgto)?'conformidade com o pactuado':'até 5 (cinco) dias após a quitação integral do preço'}. Todos os débitos incidentes sobre o imóvel (IPTU, condomínio, água, energia, taxas) até a data da imissão na posse são de responsabilidade do VENDEDOR.</p>
    <h3>Cláusula 5ª – Da evicção e das declarações</h3><p>O VENDEDOR responde pela evicção de direitos e declara inexistir ação judicial ou dívida que possa afetar o imóvel. O COMPRADOR declara conhecer o imóvel e aceitá-lo no estado em que se encontra.</p>
    <h3>Cláusula 6ª – Da multa</h3><p>O descumprimento por qualquer das partes sujeita o infrator a multa penal de 10% (dez por cento) do preço, sem prejuízo de perdas e danos. Se o COMPRADOR desistir, perderá o sinal, salvo se o descumprimento decorrer de culpa do VENDEDOR, que o devolverá em dobro.</p>
    <h3>Cláusula 7ª – Da corretagem</h3><p>A comissão de corretagem, no valor de <b>${esc(k.comissao||'__')}%</b> sobre o preço (${brl((k.valor||0)*(k.comissao||0)/100)}), é devida à IMOBILIÁRIA pelo VENDEDOR, e se torna exigível com a assinatura deste instrumento.</p>
    ${k.extras?`<h3>Cláusulas adicionais</h3><p>${esc(k.extras).replace(/\n/g,'<br>')}</p>`:''}
    <h3>Do foro</h3><p>Fica eleito o foro da comarca de <b>${esc(k.foro||c.foro)}</b>.</p><p>E, por estarem justos e contratados, assinam em 2 (duas) vias, na presença de 2 (duas) testemunhas.</p>${loc_}
    <div class="p-sign">${sig(k.a&&k.a.nome,'VENDEDOR(A)')}${sig(k.b&&k.b.nome,'COMPRADOR(A)')}${sig(c.empresa,`IMOBILIÁRIA · CRECI ${esc(c.crecij)}`)}${testem}</div>`;
  }else{
    const ven=k.negocio!=='Locação';T=`AUTORIZAÇÃO PARA ${ven?'VENDA':'LOCAÇÃO'} DE IMÓVEL${k.exclusiv?' COM EXCLUSIVIDADE':''}`;
    body=`<p>${parte(k.a)}, doravante <b>PROPRIETÁRIO(A)</b>, autoriza <b>${esc(c.empresa)}</b>, CRECI ${esc(c.crecij)}, doravante <b>IMOBILIÁRIA</b>, a intermediar a ${ven?'venda':'locação'} do imóvel: ${imvDesc(i)}, nas condições a seguir.</p>
    <h3>Cláusula 1ª – Do valor</h3><p>Valor pretendido: ${money(k.valor||0)}${ven?'':' por mês'}. Propostas diferentes dependerão de aprovação do PROPRIETÁRIO.</p>
    <h3>Cláusula 2ª – Do prazo${k.exclusiv?' e da exclusividade':''}</h3><p>A autorização vale por <b>${esc(k.prazoAut||90)} dias</b> a partir de ${dbr(k.data)}, renovando-se por igual período se não houver manifestação em contrário.${k.exclusiv?' Durante o prazo, o PROPRIETÁRIO não negociará o imóvel diretamente nem o confiará a outro corretor ou imobiliária, sendo a comissão devida à IMOBILIÁRIA ainda que o negócio seja fechado pelo próprio PROPRIETÁRIO ou por terceiros.':' A autorização é sem exclusividade, podendo o PROPRIETÁRIO contratar outros corretores.'}</p>
    <h3>Cláusula 3ª – Da comissão</h3><p>O PROPRIETÁRIO pagará à IMOBILIÁRIA comissão de <b>${esc(k.comissao||'__')}%</b> ${ven?`sobre o valor final da venda`:`sobre o valor do primeiro aluguel contratado`}, devida quando fechado o negócio com interessado apresentado pela IMOBILIÁRIA durante a vigência ou em até 90 (noventa) dias após o término, ainda que concluído diretamente com o PROPRIETÁRIO.</p>
    <h3>Cláusula 4ª – Das obrigações</h3><p>O PROPRIETÁRIO declara ser legítimo titular do imóvel, comprometendo-se a fornecer a documentação e certidões necessárias e a manter o imóvel em condições de visita. Autoriza a IMOBILIÁRIA a fotografar e divulgar o imóvel em anúncios, redes sociais e portais, e a instalar placa de divulgação, quando permitido.</p>
    ${k.extras?`<h3>Observações</h3><p>${esc(k.extras).replace(/\n/g,'<br>')}</p>`:''}
    <h3>Do foro</h3><p>Fica eleito o foro da comarca de <b>${esc(k.foro||c.foro)}</b>.</p>${loc_}
    <div class="p-sign">${sig(k.a&&k.a.nome,'PROPRIETÁRIO(A)')}${sig(c.empresa,`IMOBILIÁRIA · CRECI ${esc(c.crecij)}`)}</div>`;
  }
  return `<div class="paper">${pHead(c,'CONTRATO',k.numero)}<h2>${T}</h2>${body}${pFoot(c)}</div>`;
}

function standalone(title,inner){return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"><style>body{margin:0;background:#e9ebf6;padding:18px}${PAPER_CSS()}.noprint{display:block;margin:0 auto 14px;padding:10px 18px;border:0;border-radius:8px;background:#070B4A;color:#E4BB61;font:600 14px system-ui;cursor:pointer}@media print{body{background:#fff;padding:0}.noprint{display:none}.paper{box-shadow:none;border-radius:0;padding:0}@page{margin:16mm}}</style></head><body><button class="noprint" onclick="print()">Imprimir ou salvar em PDF</button>${inner}</body></html>`}
function showDoc(kind,id,tries=0){
  const x=S[kind].find(r=>r.id===id);if(!x){if(tries<6)setTimeout(()=>showDoc(kind,id,tries+1),300);return}const html=DOCFN[kind](x);
  const nm={recibos:'recibo',contratos:'contrato',vistorias:'vistoria'}[kind];const fn=`${nm}-${String(x.numero||id).replace('/','-')}.html`;
  modal({title:`${nm[0].toUpperCase()+nm.slice(1)} ${x.numero||''}`,wide:true,
   body:`${kind==='contratos'?'<p class="sheetnote">Modelo-base com cláusulas usuais da Lei do Inquilinato. Revise com seu advogado antes de colher as assinaturas.</p>':''}<div id="pp">${html}</div>`,
   foot:`${delBtn()}${(kind==='contratos'&&(x.tipo==='loc_res'||x.tipo==='loc_com'))?`<button class="btn" data-act="rc" type="button">Recibo do aluguel</button>`:''}<button class="btn" data-act="cp" type="button">${ic('copy',16)} Copiar texto</button>${DL?`<button class="btn" data-act="dl" type="button">${ic('download',16)} Baixar</button>`:''}<button class="btn primary" data-act="ed" type="button">${ic('edit',16)} Editar</button>`,
   mount(m){
    $('[data-act=cp]',m).onclick=async()=>{const t=$('.paper',m).innerText;try{await navigator.clipboard.writeText(t);toast('Texto copiado.')}catch(e){const r=document.createRange();r.selectNodeContents($('.paper',m));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Texto selecionado. Use Copiar do aparelho.')}};
    const dl=$('[data-act=dl]',m);if(dl)dl.onclick=async()=>{try{await DL.save({filename:fn,data:standalone(fn,html)});toast('Arquivo salvo. Abra e use “Imprimir ou salvar em PDF”.')}catch(e){if(e&&e.code!=='declined')toast('Não foi possível baixar.')}};
    const rc=$('[data-act=rc]',m);if(rc)rc.onclick=()=>{const t=today();closeModal();openRecibo(null,{imovelId:x.imovelId,pagador:(x.b||{}).nome,cpf:(x.b||{}).cpf,referente:`Aluguel de ${MESES[+t.slice(5,7)-1]}/${t.slice(0,4)}`,linhas:[{d:'Aluguel',v:x.valor||null}]})};
    $('[data-act=ed]',m).onclick=()=>({recibos:openRecibo,contratos:openContrato,vistorias:openVistoria})[kind](x);
    armDelete($('[data-act=del]',m),async()=>{await remove(kind,id);closeModal()});
   }});
}

 {k:'numero',l:'Número',ro:true},{k:'data',l:'Data',t:'date'},{k:'forma',l:'Forma de pagamento',t:'select',o:['PIX','Dinheiro','Transferência','Boleto','Cartão','Cheque']},{k:'imovelId',l:'Imóvel',t:'select',o:imvOpts},

   foot:`<button class="btn" data-close type="button">Cancelar</button><button class="btn primary" data-act="save" type="button">Salvar e ver recibo</button>`,

    m.addEventListener('click',e=>{const x=e.target.closest('[data-rm]');if(x){linhas.splice(+x.dataset.rm,1);if(!linhas.length)linhas=[{d:'',v:null}];draw()}});

      ls.forEach(l=>{if(!l.d)l.d=v.referente||'Pagamento'});const rec={...o,...v,linhas:ls};if(o.id)rec.id=o.id;const id=await save('recibos',rec);S.docTab='recibos';closeModal();toast('Recibo salvo.');setTimeout(()=>showDoc('recibos',id),250)};

   mount(m){

  $('#sc').onclick=async()=>{const v=readForm($('#cf'));try{await DB.doc('config/main').set({...S.config,...v});toast('Ajustes salvos.')}catch(e){toast(failMsg(e))}};
  const b=$('#bkb');if(b)b.onclick=backupAll;const r=$('#rst');if(r)r.onchange=()=>{if(r.files[0])restoreFile(r.files[0]);r.value=''};
  $$('[data-csv]').forEach(x=>x.onclick=()=>exportCSV(x.dataset.csv))},
 paint(){const f=$('#cf');if(f&&!f.contains(document.activeElement))f.innerHTML=fields(CFG_F,cfg());const b=$('#bk');if(b)b.textContent=bkTxt()}};

/* ================= INÍCIO ================= */
function mountShell(){
  $('#navSide').innerHTML=NAV.map(([k,l,i])=>`<button class="nv" type="button" data-go="${k}">${ic(i)}<span>${l}</span></button>`).join('');
  $('#tabbar').innerHTML=NAV.slice(0,5).map(([k,l,i])=>`<button type="button" data-go="${k}">${ic(i,22)}<span>${l}</span></button>`).join('');
  $('#cfgTop').innerHTML=ic('gear');
  document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go)});
  $('#cfgTop').onclick=()=>go('config');$('#themeTop').onclick=toggleTheme;$('#themeSide').onclick=toggleTheme;
  try{const t=localStorage.getItem('lb_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
  themeBtns();
}
function offlineNotice(){$('#view').innerHTML=`<div class="empty" style="margin-top:40px"><b>Entre na sua conta para abrir o sistema</b>Os dados ficam salvos com segurança e só aparecem para quem tem acesso de edição. Abra este link logado na sua conta Claude.</div>`}
let rq;const later=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(paint)};
async function boot(){
  mountShell();let r='painel';try{r=localStorage.getItem('lb_view')||'painel'}catch(e){}if(!V[r])r='painel';
  go(r);
  const cl=window.claude;if(cl&&cl.use){try{DB=await cl.use('db')}catch(e){}try{ASSETS=await cl.use('assets')}catch(e){}try{DL=await cl.use('downloads')}catch(e){}}
  if(!DB){S.offline=true;offlineNotice();return}
  if(S.view==='site'&&DL)V.site.build();
  COLS.forEach(c=>DB.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[c]=1;later()},e=>{S.err=e.code;if(e.code!=='revoked')toast('Não foi possível carregar '+c+'.')}));
  DB.doc('config/main').onSnapshot(s=>{S.config=s.exists?s.data():{};S.loaded.config=1;later()},()=>{});
}
boot();
</script>
